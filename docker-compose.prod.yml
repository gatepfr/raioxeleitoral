version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: iceberg-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - iceberg_db_data:/var/lib/postgresql/data

  app:
    image: ghcr.io/gatepfr/raioxeleitoral:latest
    container_name: iceberg-app-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - db

volumes:
  iceberg_db_data:
